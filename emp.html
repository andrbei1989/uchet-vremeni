<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Отметка · Belgi</title>
<style>
:root{
  --bg:#0f172a; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#b45309;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.card{
  width:100%; max-width:420px; background:#fff; border-radius:22px; padding:24px 20px 20px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.55); text-align:center;
}
h1{font-size:21px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
.badge.ok{background:#eafaf0;color:#15803d}
.badge.bad{background:#fdeeee;color:#b91c1c}
.badge.warn{background:#fff8e6;color:#92400e}
.badge.info{background:#eff4ff;color:#1d4ed8}
.icon{width:92px;height:92px;margin:6px auto 14px;border-radius:50%;display:grid;place-items:center}
.icon svg{width:48px;height:48px;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon.ok,.icon.in{background:#eafaf0}.icon.ok svg,.icon.in svg{stroke:#16a34a}
.icon.out{background:#eff4ff}.icon.out svg{stroke:#2563eb}
.icon.bad{background:#fdeeee}.icon.bad svg{stroke:#dc2626}
.icon.warn{background:#fff8e6}.icon.warn svg{stroke:#b45309}
.big{font-size:34px;font-weight:800;letter-spacing:.06em;margin:2px 0 6px}
.big.in{color:#16a34a}.big.out{color:#2563eb}
.name{font-size:22px;font-weight:800;margin-top:12px}
.time{font-size:16px;font-weight:700;margin-top:2px}
.rows{text-align:left;margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:9px;font-size:14px}
.rows .r{display:flex;justify-content:space-between;gap:12px}
.rows .r span:first-child{color:var(--muted)}
.rows .r span:last-child{font-weight:600;text-align:right}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid #dbeafe;border-top-color:var(--accent);animation:spin .8s linear infinite;margin:26px auto}
@keyframes spin{to{transform:rotate(360deg)}}
button{
  font:inherit;cursor:pointer;border:0;width:100%;min-height:52px;border-radius:14px;
  font-weight:700;font-size:16px;margin-top:20px;background:var(--accent);color:#fff;
}
button:active{opacity:.88}
button.ghost{background:#f1f5f9;color:#334155;margin-top:10px}
.note{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13.5px;color:#475569;text-align:left;margin-top:16px}
.note.warn{background:#fff8e6;border-color:#fde68a;color:#92400e}
.note b{color:#0f172a}
.uz{display:block;font-size:.86em;font-weight:500;color:var(--muted);margin-top:3px;letter-spacing:0}
h1 .uz{font-size:16px;font-weight:600}
.big .uz{font-size:20px;font-weight:800;letter-spacing:.06em;color:inherit;opacity:.75;margin-top:0}
.note .uz{color:#64748b;margin-top:8px;padding-top:8px;border-top:1px dashed #e2e8f0}
.note.warn .uz{color:#a16207;border-top-color:#fde68a}
.rows .r span:first-child .uz{font-size:12px}
.stats{margin-top:16px;text-align:left}
.stats .hd{font-size:13px;font-weight:700;color:#334155;margin-bottom:8px}
.stats .hd .uz{font-size:12px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.tile .l{font-size:12px;color:#475569;margin-top:3px;line-height:1.25}
.tile .l .uz{font-size:11px;margin-top:1px}
.tile.wide{grid-column:1/-1}
.tile.bad .v{color:#b91c1c}
.tile.good .v{color:#15803d}
.uzi{opacity:.8;font-weight:600}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner" id="spin"></div>
  <h1 id="title">Открываем…<span class="uz">Ochilmoqda…</span></h1>
  <p class="muted" id="sub"></p>
  <div id="body"></div>
</div>

<script>
"use strict";

/* Служебная страница сотрудника. Открывается только из QR-кода:
   ?r=КОД&k=КЛЮЧ&s=СЕРВЕР  — привязка телефона (один раз)
   ?t=in|out&s=СЕРВЕР      — отметка входа или выхода
   Все тексты — на русском и узбекском (латиница). */

var ME_KEY = "tt4_me";
/* основной сервер: короткие QR-коды не содержат его адреса */
var DEFAULT_SERVER = "https://script.google.com/macros/s/AKfycby5_KTl2-IpW_wwsVHOQJ9Pb1IEfW_BpI2LPGkfRcZuRUk9XyasibLjQX-TkBq4W8xP/exec";

function qs(name) {
  var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
}
function ls(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function esc(s) {
  return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
/* двуязычный текст: русский, под ним узбекский. Аргументы — уже готовый HTML */
function L(ru, uz) { return ru + '<span class="uz">' + uz + "</span>"; }
/* в одну строку: «Готово · Tayyor» */
function I(ru, uz) { return ru + ' <span class="uzi">· ' + uz + "</span>"; }
/* сообщение об ошибке, которое несёт оба языка */
function Err(ru, uz) { var e = new Error(ru); e.uz = uz; return e; }

function deviceLabel() {
  var ua = navigator.userAgent || "";
  var m = /Android[^;)]*;\s*([^;)]+?)(?:\s+Build|\))/.exec(ua);
  if (m && m[1] && !/^(K|wv)$/.test(m[1].trim())) return "Android · " + m[1].trim().slice(0, 30);
  if (/Android/i.test(ua)) return "Android";
  if (/iPhone|iPad|iPod/i.test(ua)) return "iPhone";
  return "Телефон";
}
function validServer(u) { return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(String(u || "").trim()); }

/* ================= сеть ================= */
function call(server, params) {
  return new Promise(function (resolve, reject) {
    if (!validServer(server)) return reject(Err("В QR-коде нет адреса сервера. Попросите руководителя распечатать коды заново.",
      "QR-kodda server manzili yoʻq. Rahbardan kodlarni qayta chop etishni soʻrang."));
    var cb = "__e" + Math.random().toString(36).slice(2, 10);
    var url = server.trim() + "?callback=" + cb;
    Object.keys(params).forEach(function (k) {
      if (params[k] !== undefined && params[k] !== null) url += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
    });
    var sc = document.createElement("script"), done = false;
    var timer = setTimeout(function () { finish(function () { reject(Err("Сервер не ответил за 20 секунд.", "Server 20 soniya ichida javob bermadi.")); }); }, 20000);
    function finish(fn) {
      if (done) return;
      done = true; clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (sc.parentNode) sc.parentNode.removeChild(sc);
      fn();
    }
    window[cb] = function (d) { finish(function () { resolve(d || {}); }); };
    sc.onerror = function () { finish(function () { reject(Err("Нет связи с сервером. Проверьте интернет.", "Server bilan aloqa yoʻq. Internetni tekshiring.")); }); };
    sc.src = url;
    document.head.appendChild(sc);
  });
}

function getPosition() {
  return new Promise(function (resolve, reject) {
    if (!navigator.geolocation) return reject(Err("Телефон не поддерживает геолокацию.", "Telefon geolokatsiyani qoʻllab-quvvatlamaydi."));
    navigator.geolocation.getCurrentPosition(
      function (p) { resolve(p.coords); },
      function (e) {
        var err = Err("Не удалось определить местоположение.", "Joylashuvni aniqlab boʻlmadi.");
        if (e && e.code === 1) err = Err("Доступ к местоположению запрещён. Разрешите его для этого сайта в настройках браузера и попробуйте снова.",
          "Joylashuvga ruxsat berilmagan. Brauzer sozlamalarida ushbu saytga ruxsat bering va qayta urinib koʻring.");
        if (e && e.code === 3) err = Err("Местоположение не определилось за 20 секунд. Подойдите ближе к окну и попробуйте снова.",
          "Joylashuv 20 soniyada aniqlanmadi. Derazaga yaqinroq boring va qayta urinib koʻring.");
        reject(err);
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });
}

/* ================= экраны ================= */
var elSpin = document.getElementById("spin");
var elTitle = document.getElementById("title");
var elSub = document.getElementById("sub");
var elBody = document.getElementById("body");

var ICONS = {
  ok: '<path d="M20 6L9 17l-5-5"/>',
  bad: '<path d="M18 6L6 18M6 6l12 12"/>',
  warn: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  in: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>',
  out: '<path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>'
};
function icon(kind) { return '<div class="icon ' + kind + '"><svg viewBox="0 0 24 24">' + ICONS[kind] + "</svg></div>"; }
/* title и sub — двуязычный HTML (через L) */
function spinner(title, sub) {
  elSpin.classList.remove("hidden");
  elTitle.innerHTML = title;
  elSub.innerHTML = sub || "";
  elBody.innerHTML = "";
}
function screen(title, html) {
  elSpin.classList.add("hidden");
  elTitle.innerHTML = title;
  elSub.innerHTML = "";
  elBody.innerHTML = html;
}
function problem(title, kind, badge, text, buttons) {
  screen(title, icon(kind) + (badge ? '<span class="badge ' + (kind === "bad" ? "bad" : "warn") + '">' + badge + "</span>" : "") +
    '<div class="note">' + text + "</div>" + (buttons || ""));
}
function btn(act, ru, uz, ghost, type) {
  return '<button' + (ghost ? ' class="ghost"' : "") + ' data-act="' + act + '"' + (type ? ' data-type="' + type + '"' : "") + ">" + I(ru, uz) + "</button>";
}

/* ================= привязка телефона ================= */
async function doRegister(code, key, server, force) {
  var me = ls(ME_KEY, null);
  if (me && me.code && me.code !== code && !force) {
    var who = "<b>" + esc(me.name || me.code) + "</b>";
    return problem(L("Телефон уже привязан", "Telefon allaqachon bogʻlangan"), "warn", I("Другой сотрудник", "Boshqa xodim"),
      L("Этот телефон привязан к сотруднику " + who + ".<br><br>Если это ваш телефон и вы сканируете свой код — продолжайте. Тогда " + who +
        " больше не сможет отмечаться с этого телефона.",
        "Bu telefon " + who + " xodimiga bogʻlangan.<br><br>Agar bu sizning telefoningiz boʻlsa va oʻz kodingizni skanerlayotgan boʻlsangiz — davom eting. Shunda " + who +
        " bu telefondan boshqa belgi qoʻya olmaydi."),
      btn("force-reg", "Привязать к новому коду", "Yangi kodga bogʻlash") + btn("close", "Отмена", "Bekor qilish", true));
  }
  spinner(L("Привязываем телефон…", "Telefon bogʻlanmoqda…"), "Код " + esc(code));
  var reply;
  try {
    reply = await call(server, {
      action: "register", code: code, key: key, device: deviceLabel(),
      secret: me && me.code === code ? me.secret : undefined
    });
  } catch (e) {
    return problem(L("Нет связи", "Aloqa yoʻq"), "warn", "",
      L("<b>Не удалось связаться с сервером.</b><br>" + esc(e.message) + "<br><br>Проверьте интернет и отсканируйте код ещё раз.",
        "<b>Server bilan bogʻlanib boʻlmadi.</b><br>" + esc(e.uz || "") + "<br><br>Internetni tekshirib, kodni qayta skanerlang."),
      btn("reload", "Повторить", "Qayta urinish"));
  }
  if (!reply.ok) {
    var when = reply.boundAt ? " (" + esc(reply.boundAt) + ")" : "";
    var msg = {
      used: L("Этот код уже привязан к другому телефону" + when + ".<br><br>Если вы сменили телефон, попросите руководителя выдать вам новый код.",
        "Bu kod boshqa telefonga bogʻlangan" + when + ".<br><br>Agar telefoningizni almashtirgan boʻlsangiz, rahbardan yangi kod soʻrang."),
      old_qr: L("Этот QR-код устарел — руководитель выпустил новый. Попросите свежий код.",
        "Bu QR-kod eskirgan — rahbar yangisini chiqargan. Yangi kod soʻrang."),
      unknown_code: L("Такого сотрудника нет в списке. Обратитесь к руководителю.",
        "Bunday xodim roʻyxatda yoʻq. Rahbarga murojaat qiling."),
      blocked: L("Доступ закрыт руководителем. Обратитесь к нему.",
        "Rahbar ruxsatni yopgan. Unga murojaat qiling.")
    }[reply.error] || L("Сервер ответил: " + esc(reply.error || "ошибка"), "Server javobi: " + esc(reply.error || "xato"));
    return problem(L("Код не принят", "Kod qabul qilinmadi"), "bad",
      reply.error === "used" ? I("Код уже использован", "Kod ishlatilgan") : I("Отказ", "Rad etildi"), msg);
  }
  me = { code: reply.code, name: reply.name, secret: reply.secret, server: server, boundAt: reply.boundAt };
  if (!lsSet(ME_KEY, me)) {
    return problem(L("Браузер не сохранил данные", "Brauzer maʼlumotlarni saqlamadi"), "warn", "",
      L("Похоже, страница открыта в режиме инкогнито. Откройте код в обычном браузере телефона (Chrome) и отсканируйте его снова.",
        "Sahifa inkognito rejimida ochilganga oʻxshaydi. Kodni telefonning oddiy brauzerida (Chrome) oching va qayta skanerlang."));
  }
  screen(reply.repeat ? L("Телефон уже привязан", "Telefon allaqachon bogʻlangan") : L("Телефон привязан", "Telefon bogʻlandi"),
    icon("ok") + '<span class="badge ok">' + I("Готово", "Tayyor") + "</span>" +
    '<div class="name">' + esc(me.name) + "</div>" +
    '<div class="muted mono">' + esc(me.code) + "</div>" +
    '<div class="rows">' +
      '<div class="r"><span>' + L("Телефон", "Telefon") + "</span><span>" + esc(deviceLabel()) + "</span></div>" +
      (me.boundAt ? '<div class="r"><span>' + L("Привязан", "Bogʻlangan") + "</span><span>" + esc(me.boundAt) + "</span></div>" : "") +
    "</div>" +
    '<div class="note">' + L(
      "<b>Что дальше.</b> Придя на работу, наведите камеру телефона на QR-код <b>«ВХОД»</b> у двери, уходя — на <b>«ВЫХОД»</b>. " +
      "Открывать что-то вручную не нужно.<br><br>Отмечайтесь в этом же браузере и не очищайте его данные — иначе телефон придётся привязывать заново.",
      "<b>Keyingi qadam.</b> Ishga kelganingizda telefon kamerasini eshik yonidagi <b>«KIRISH»</b> QR-kodiga, ketayotganingizda — <b>«CHIQISH»</b> kodiga qarating. " +
      "Hech narsani qoʻlda ochish shart emas.<br><br>Belgini shu brauzerda qoʻying va uning maʼlumotlarini oʻchirmang — aks holda telefonni qayta bogʻlashga toʻgʻri keladi.") +
    "</div>" + btn("close", "Готово", "Tayyor"));
}

/* ================= отметка ================= */
var PUNCH = {
  in: { word: "ВХОД", wordUz: "KIRISH", cls: "in", title: L("Вход отмечен", "Kirish belgilandi") },
  out: { word: "ВЫХОД", wordUz: "CHIQISH", cls: "out", title: L("Выход отмечен", "Chiqish belgilandi") }
};

async function doPunch(type, server, noGeo) {
  var meta = PUNCH[type];
  var me = ls(ME_KEY, null);
  if (!me || !me.code || !me.secret) {
    return problem(L("Телефон не привязан", "Telefon bogʻlanmagan"), "warn", I("Нужна привязка", "Bogʻlash kerak"),
      L("<b>Сначала отсканируйте свой личный код регистрации.</b><br>Его выдаёт руководитель один раз. После этого вход и выход отмечаются сканированием QR у двери.",
        "<b>Avval shaxsiy roʻyxatdan oʻtish kodingizni skanerlang.</b><br>Uni rahbar bir marta beradi. Shundan soʻng kirish va chiqish eshik yonidagi QR-kodni skanerlash orqali belgilanadi."));
  }
  server = validServer(server) ? server : (validServer(me.server) ? me.server : DEFAULT_SERVER);

  var coords = null;
  if (!noGeo) {
    spinner(L("Определяем местоположение…", "Joylashuv aniqlanmoqda…"),
      L("Разрешите доступ к геоданным, если браузер спросит", "Brauzer soʻrasa, joylashuvga ruxsat bering"));
    try { coords = await getPosition(); } catch (e) {
      return problem(L("Нужно местоположение", "Joylashuv kerak"), "warn", "",
        L(esc(e.message) + "<br><br>Руководитель видит, отмечены ли вы на рабочем месте.",
          esc(e.uz || "") + "<br><br>Rahbar ish joyida belgi qoʻyganingizni koʻradi."),
        btn("retry", "Попробовать снова", "Qayta urinish", false, type) +
        btn("nogeo", "Отметить без местоположения", "Joylashuvsiz belgilash", true, type));
    }
  }

  spinner(L("Сохраняем отметку…", "Belgi saqlanmoqda…"), esc(me.name || me.code));
  var r;
  try {
    r = await call(server, {
      action: "punch", type: type, code: me.code, secret: me.secret,
      lat: coords ? coords.latitude.toFixed(6) : undefined,
      lng: coords ? coords.longitude.toFixed(6) : undefined,
      acc: coords ? Math.round(coords.accuracy) : undefined
    });
  } catch (e) {
    return problem(L("Не сохранилось", "Saqlanmadi"), "warn", "",
      L("<b>Отметка не записана.</b><br>" + esc(e.message), "<b>Belgi yozilmadi.</b><br>" + esc(e.uz || "")),
      btn("retry", "Повторить", "Qayta urinish", false, type));
  }
  if (!r.ok) {
    var title = L("Отметка не принята", "Belgi qabul qilinmadi");
    if (r.error === "not_registered") {
      return problem(title, "bad", I("Телефон не привязан", "Telefon bogʻlanmagan"),
        L("Сервер не узнаёт этот телефон — возможно, руководитель выдал вам новый код. Отсканируйте свой новый код регистрации.",
          "Server bu telefonni tanimayapti — ehtimol, rahbar sizga yangi kod bergan. Yangi roʻyxatdan oʻtish kodingizni skanerlang."));
    }
    if (r.error === "blocked") {
      return problem(title, "bad", I("Доступ закрыт", "Ruxsat yopilgan"),
        L("Руководитель закрыл вам доступ. Обратитесь к нему.", "Rahbar sizga ruxsatni yopgan. Unga murojaat qiling."));
    }
    return problem(title, "bad", I("Ошибка", "Xato"),
      L("Сервер ответил: " + esc(r.error || "ошибка"), "Server javobi: " + esc(r.error || "xato")),
      btn("retry", "Повторить", "Qayta urinish", false, type));
  }
  if (r.name && r.name !== me.name) { me.name = r.name; lsSet(ME_KEY, me); }
  showDone(meta, r);
}

var MONTHS_RU = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
var MONTHS_UZ = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
function fmtH(x) { return String(Math.round((Number(x) || 0) * 10) / 10).replace(".", ","); }
function statsBlock(st) {
  if (!st || typeof st.hours !== "number") return "";
  var m = (st.month || 1) - 1;
  function tile(val, ru, uz, cls) {
    return '<div class="tile' + (cls ? " " + cls : "") + '"><div class="v">' + val + '</div><div class="l">' + L(ru, uz) + "</div></div>";
  }
  return '<div class="stats"><div class="hd">' +
      L("Ваш " + MONTHS_RU[m] + ": с 1-го числа", MONTHS_UZ[m].charAt(0).toUpperCase() + MONTHS_UZ[m].slice(1) + " oyi: 1-sanadan boshlab") + "</div>" +
    '<div class="sgrid">' +
      tile(fmtH(st.hours) + " ч", "Отработано часов", "Ishlangan soat", "wide good") +
      tile(st.shifts, "Смен", "Smenalar") +
      tile(st.late, "Опозданий", "Kechikishlar", st.late ? "bad" : "") +
      tile(st.forgotten, "Забытых выходов", "Unutilgan chiqishlar", st.forgotten ? "bad" : "") +
      tile(fmtH(st.under) + " ч", "Недоработано", "Yetishmagan vaqt", st.under > 0 ? "bad" : "") +
    "</div></div>";
}

function showDone(meta, r) {
  var zone;
  if (r.zone === "в зоне") zone = '<span style="color:#15803d">' + L("на рабочем месте", "ish joyida") + "</span>";
  else if (r.zone === "вне зоны") zone = '<span style="color:#b91c1c">' + L("вне рабочего места" + (r.distance ? " · " + r.distance + " м" : ""), "ish joyidan tashqarida") + "</span>";
  else if (r.zone === "без координат") zone = '<span style="color:#92400e">' + L("не определено", "aniqlanmadi") + "</span>";
  else zone = '<span class="muted">' + L("не проверяется", "tekshirilmaydi") + "</span>";

  var notes = [];
  if (r.duplicate) notes.push(L("Вы уже отметились только что — повторная отметка не нужна.", "Siz hozirgina belgi qoʻydingiz — takrorlash shart emas."));
  if (r.warning === "prev_open") notes.push(L("В прошлый раз вы не отметили <b>выход</b>. Сообщите руководителю.", "Oʻtgan safar <b>chiqish</b>ni belgilamagansiz. Rahbarga xabar bering."));
  if (r.warning === "no_in") notes.push(L("Сегодня не найден <b>вход</b>. Если вы забыли отметиться утром, сообщите руководителю.", "Bugun <b>kirish</b> belgisi topilmadi. Ertalab belgi qoʻyishni unutgan boʻlsangiz, rahbarga xabar bering."));
  if (r.zone === "вне зоны") notes.push(L("Отметка сохранена, но вы далеко от рабочего места. Руководитель это увидит.", "Belgi saqlandi, lekin siz ish joyidan uzoqdasiz. Rahbar buni koʻradi."));
  if (r.zone === "без координат") notes.push(L("Отметка сохранена без местоположения. Руководитель это увидит.", "Belgi joylashuvsiz saqlandi. Rahbar buni koʻradi."));

  screen(meta.title,
    icon(meta.cls) +
    '<div class="big ' + meta.cls + '">' + meta.word + '<span class="uz">' + meta.wordUz + "</span></div>" +
    '<div class="time">' + esc(r.date + " · " + r.time) + "</div>" +
    (r.duplicate ? '<div class="badge info" style="margin-top:10px">' + I("уже отмечено", "belgilangan") + "</div>" : "") +
    '<div class="rows">' +
      '<div class="r"><span>' + L("Сотрудник", "Xodim") + "</span><span>" + esc(r.name || r.code) + "</span></div>" +
      '<div class="r"><span>' + L("Местоположение", "Joylashuv") + "</span>" + zone + "</div>" +
    "</div>" +
    (notes.length ? '<div class="note warn">' + notes.join("<br><br>") + "</div>"
      : '<div class="note">' + L("Отметка записана. Страницу можно закрыть.", "Belgi yozildi. Sahifani yopishingiz mumkin.") + "</div>") +
    statsBlock(r.stats) +
    btn("close", "Готово", "Tayyor"));
}

/* ================= запуск ================= */
var P = { code: qs("r").toUpperCase(), key: qs("k").toUpperCase(), type: qs("t"), server: qs("s") };
if (!validServer(P.server) && (P.code || !P.type)) P.server = DEFAULT_SERVER;

function boot() {
  /* убираем ключ из адресной строки и истории браузера */
  try { if (location.search) history.replaceState(null, "", location.pathname); } catch (e) {}
  if (P.code && P.key) return doRegister(P.code, P.key, P.server, false);
  if (P.type === "in" || P.type === "out") return doPunch(P.type, P.server, false);
  screen(L("Служебная страница", "Xizmat sahifasi"), icon("warn") +
    '<div class="note">' + L(
      "Эта страница открывается сама, когда вы сканируете QR-код на работе камерой телефона.<br><br>" +
      "Чтобы привязать телефон — отсканируйте свой личный код. Чтобы отметиться — код «ВХОД» или «ВЫХОД» у двери.",
      "Bu sahifa ishda QR-kodni telefon kamerasi bilan skanerlaganingizda oʻzi ochiladi.<br><br>" +
      "Telefonni bogʻlash uchun — shaxsiy kodingizni skanerlang. Belgi qoʻyish uchun — eshik yonidagi «KIRISH» yoki «CHIQISH» kodini.") + "</div>");
}

document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]");
  if (!b) return;
  var act = b.getAttribute("data-act");
  if (act === "close") { window.close(); setTimeout(function () { location.replace("about:blank"); }, 150); }
  if (act === "reload") doRegister(P.code, P.key, P.server, false);
  if (act === "force-reg") doRegister(P.code, P.key, P.server, true);
  if (act === "retry") doPunch(b.getAttribute("data-type"), P.server, false);
  if (act === "nogeo") doPunch(b.getAttribute("data-type"), P.server, true);
});

boot();
</script>
</body>
</html>
