<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Отметка</title>
<style>
:root{
  --bg:#0f172a; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#b45309;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.card{
  width:100%; max-width:420px; background:#fff; border-radius:22px; padding:24px 20px 20px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.55); text-align:center;
}
h1{font-size:21px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
.badge.ok{background:#eafaf0;color:#15803d}
.badge.bad{background:#fdeeee;color:#b91c1c}
.badge.warn{background:#fff8e6;color:#92400e}
.badge.info{background:#eff4ff;color:#1d4ed8}
.icon{width:92px;height:92px;margin:6px auto 14px;border-radius:50%;display:grid;place-items:center}
.icon svg{width:48px;height:48px;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon.ok,.icon.in{background:#eafaf0}.icon.ok svg,.icon.in svg{stroke:#16a34a}
.icon.out{background:#eff4ff}.icon.out svg{stroke:#2563eb}
.icon.bad{background:#fdeeee}.icon.bad svg{stroke:#dc2626}
.icon.warn{background:#fff8e6}.icon.warn svg{stroke:#b45309}
.big{font-size:34px;font-weight:800;letter-spacing:.06em;margin:2px 0 6px}
.big.in{color:#16a34a}.big.out{color:#2563eb}
.name{font-size:22px;font-weight:800;margin-top:12px}
.time{font-size:16px;font-weight:700;margin-top:2px}
.rows{text-align:left;margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:9px;font-size:14px}
.rows .r{display:flex;justify-content:space-between;gap:12px}
.rows .r span:first-child{color:var(--muted)}
.rows .r span:last-child{font-weight:600;text-align:right}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid #dbeafe;border-top-color:var(--accent);animation:spin .8s linear infinite;margin:26px auto}
@keyframes spin{to{transform:rotate(360deg)}}
button{
  font:inherit;cursor:pointer;border:0;width:100%;min-height:52px;border-radius:14px;
  font-weight:700;font-size:16px;margin-top:20px;background:var(--accent);color:#fff;
}
button:active{opacity:.88}
button.ghost{background:#f1f5f9;color:#334155;margin-top:10px}
.note{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13.5px;color:#475569;text-align:left;margin-top:16px}
.note.warn{background:#fff8e6;border-color:#fde68a;color:#92400e}
.note b{color:#0f172a}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner" id="spin"></div>
  <h1 id="title">Открываем…</h1>
  <p class="muted" id="sub">Секунду</p>
  <div id="body"></div>
</div>

<script>
"use strict";

/* Служебная страница сотрудника. Открывается только из QR-кода:
   ?r=КОД&k=КЛЮЧ&s=СЕРВЕР  — привязка телефона (один раз)
   ?t=in|out&s=СЕРВЕР      — отметка входа или выхода */

var ME_KEY = "tt4_me";

function qs(name) {
  var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
}
function ls(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function esc(s) {
  return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function deviceLabel() {
  var ua = navigator.userAgent || "";
  var m = /Android[^;)]*;\s*([^;)]+?)(?:\s+Build|\))/.exec(ua);
  if (m && m[1] && !/^(K|wv)$/.test(m[1].trim())) return "Android · " + m[1].trim().slice(0, 30);
  if (/Android/i.test(ua)) return "Android";
  if (/iPhone|iPad|iPod/i.test(ua)) return "iPhone";
  return "Телефон";
}
function validServer(u) { return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(String(u || "").trim()); }

/* ================= сеть ================= */
function call(server, params) {
  return new Promise(function (resolve, reject) {
    if (!validServer(server)) return reject(new Error("В QR-коде нет адреса сервера. Попросите руководителя распечатать коды заново."));
    var cb = "__e" + Math.random().toString(36).slice(2, 10);
    var url = server.trim() + "?callback=" + cb;
    Object.keys(params).forEach(function (k) {
      if (params[k] !== undefined && params[k] !== null) url += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
    });
    var sc = document.createElement("script"), done = false;
    var timer = setTimeout(function () { finish(function () { reject(new Error("Сервер не ответил за 20 секунд.")); }); }, 20000);
    function finish(fn) {
      if (done) return;
      done = true; clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (sc.parentNode) sc.parentNode.removeChild(sc);
      fn();
    }
    window[cb] = function (d) { finish(function () { resolve(d || {}); }); };
    sc.onerror = function () { finish(function () { reject(new Error("Нет связи с сервером. Проверьте интернет.")); }); };
    sc.src = url;
    document.head.appendChild(sc);
  });
}

function getPosition() {
  return new Promise(function (resolve, reject) {
    if (!navigator.geolocation) return reject(new Error("Телефон не поддерживает геолокацию."));
    navigator.geolocation.getCurrentPosition(
      function (p) { resolve(p.coords); },
      function (e) {
        var m = "Не удалось определить местоположение.";
        if (e && e.code === 1) m = "Доступ к местоположению запрещён. Разрешите его для этого сайта в настройках браузера и попробуйте снова.";
        if (e && e.code === 3) m = "Местоположение не определилось за 20 секунд. Подойдите ближе к окну и попробуйте снова.";
        reject(new Error(m));
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });
}

/* ================= экраны ================= */
var elSpin = document.getElementById("spin");
var elTitle = document.getElementById("title");
var elSub = document.getElementById("sub");
var elBody = document.getElementById("body");

var ICONS = {
  ok: '<path d="M20 6L9 17l-5-5"/>',
  bad: '<path d="M18 6L6 18M6 6l12 12"/>',
  warn: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  in: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>',
  out: '<path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>'
};
function icon(kind) { return '<div class="icon ' + kind + '"><svg viewBox="0 0 24 24">' + ICONS[kind] + "</svg></div>"; }
function spinner(title, sub) {
  elSpin.classList.remove("hidden");
  elTitle.textContent = title;
  elSub.textContent = sub || "";
  elBody.innerHTML = "";
}
function screen(title, html) {
  elSpin.classList.add("hidden");
  elTitle.textContent = title;
  elSub.textContent = "";
  elBody.innerHTML = html;
}
function problem(title, kind, badge, text, buttons) {
  screen(title, icon(kind) + (badge ? '<span class="badge ' + (kind === "bad" ? "bad" : "warn") + '">' + esc(badge) + "</span>" : "") +
    '<div class="note">' + text + "</div>" + (buttons || ""));
}

/* ================= привязка телефона ================= */
async function doRegister(code, key, server, force) {
  var me = ls(ME_KEY, null);
  if (me && me.code && me.code !== code && !force) {
    return problem("Телефон уже привязан", "warn", "Другой сотрудник",
      "Этот телефон привязан к сотруднику <b>" + esc(me.name || me.code) + "</b>.<br><br>" +
      "Если это ваш телефон и вы сканируете свой код — продолжайте. Тогда " + esc(me.name || me.code) +
      " больше не сможет отмечаться с этого телефона.",
      '<button data-act="force-reg">Привязать к новому коду</button><button class="ghost" data-act="close">Отмена</button>');
  }
  spinner("Привязываем телефон…", "Код " + code);
  var reply;
  try {
    reply = await call(server, {
      action: "register", code: code, key: key, device: deviceLabel(),
      secret: me && me.code === code ? me.secret : undefined
    });
  } catch (e) {
    return problem("Нет связи", "warn", "", "<b>Не удалось связаться с сервером.</b><br>" + esc(e.message) + "<br><br>Проверьте интернет и отсканируйте код ещё раз.",
      '<button data-act="reload">Повторить</button>');
  }
  if (!reply.ok) {
    var msg = {
      used: "Этот код уже привязан к другому телефону" + (reply.boundAt ? " (" + esc(reply.boundAt) + ")" : "") +
        ".<br><br>Если вы сменили телефон, попросите руководителя выдать вам новый код.",
      old_qr: "Этот QR-код устарел — руководитель выпустил новый. Попросите свежий код.",
      unknown_code: "Такого сотрудника нет в списке. Обратитесь к руководителю.",
      blocked: "Доступ закрыт руководителем. Обратитесь к нему."
    }[reply.error] || "Сервер ответил: " + esc(reply.error || "ошибка");
    return problem("Код не принят", "bad", reply.error === "used" ? "Код уже использован" : "Отказ", msg);
  }
  me = { code: reply.code, name: reply.name, secret: reply.secret, server: server, boundAt: reply.boundAt };
  if (!lsSet(ME_KEY, me)) {
    return problem("Браузер не сохранил данные", "warn", "", "Похоже, страница открыта в режиме инкогнито. Откройте код в обычном браузере телефона (Chrome) и отсканируйте его снова.");
  }
  screen(reply.repeat ? "Телефон уже привязан" : "Телефон привязан",
    icon("ok") + '<span class="badge ok">Готово</span>' +
    '<div class="name">' + esc(me.name) + "</div>" +
    '<div class="muted mono">' + esc(me.code) + "</div>" +
    '<div class="rows">' +
      '<div class="r"><span>Телефон</span><span>' + esc(deviceLabel()) + "</span></div>" +
      (me.boundAt ? '<div class="r"><span>Привязан</span><span>' + esc(me.boundAt) + "</span></div>" : "") +
    "</div>" +
    '<div class="note"><b>Что дальше.</b> Придя на работу, наведите камеру телефона на QR-код <b>«ВХОД»</b> у двери, уходя — на <b>«ВЫХОД»</b>. ' +
    "Открывать что-то вручную не нужно.<br><br>Отмечайтесь в этом же браузере и не очищайте его данные — иначе телефон придётся привязывать заново.</div>" +
    '<button data-act="close">Готово</button>');
}

/* ================= отметка ================= */
var PUNCH = {
  in: { word: "ВХОД", cls: "in", title: "Вход отмечен" },
  out: { word: "ВЫХОД", cls: "out", title: "Выход отмечен" }
};

async function doPunch(type, server, noGeo) {
  var meta = PUNCH[type];
  var me = ls(ME_KEY, null);
  if (!me || !me.code || !me.secret) {
    return problem("Телефон не привязан", "warn", "Нужна привязка",
      "<b>Сначала отсканируйте свой личный код регистрации.</b><br>Его выдаёт руководитель один раз. После этого вход и выход отмечаются сканированием QR у двери.");
  }
  server = validServer(server) ? server : me.server;

  var coords = null;
  if (!noGeo) {
    spinner("Определяем местоположение…", "Разрешите доступ к геоданным, если браузер спросит");
    try { coords = await getPosition(); } catch (e) {
      return problem("Нужно местоположение", "warn", "", esc(e.message) +
        "<br><br>Руководитель видит, отмечены ли вы на рабочем месте.",
        '<button data-act="retry" data-type="' + type + '">Попробовать снова</button>' +
        '<button class="ghost" data-act="nogeo" data-type="' + type + '">Отметить без местоположения</button>');
    }
  }

  spinner("Сохраняем отметку…", me.name || me.code);
  var r;
  try {
    r = await call(server, {
      action: "punch", type: type, code: me.code, secret: me.secret,
      lat: coords ? coords.latitude.toFixed(6) : undefined,
      lng: coords ? coords.longitude.toFixed(6) : undefined,
      acc: coords ? Math.round(coords.accuracy) : undefined
    });
  } catch (e) {
    return problem("Не сохранилось", "warn", "", "<b>Отметка не записана.</b><br>" + esc(e.message),
      '<button data-act="retry" data-type="' + type + '">Повторить</button>');
  }
  if (!r.ok) {
    if (r.error === "not_registered") {
      return problem("Отметка не принята", "bad", "Телефон не привязан",
        "Сервер не узнаёт этот телефон — возможно, руководитель выдал вам новый код. Отсканируйте свой новый код регистрации.");
    }
    if (r.error === "blocked") {
      return problem("Отметка не принята", "bad", "Доступ закрыт", "Руководитель закрыл вам доступ. Обратитесь к нему.");
    }
    return problem("Отметка не принята", "bad", "Ошибка", "Сервер ответил: " + esc(r.error || "ошибка"),
      '<button data-act="retry" data-type="' + type + '">Повторить</button>');
  }
  if (r.name && r.name !== me.name) { me.name = r.name; lsSet(ME_KEY, me); }
  showDone(meta, r);
}

function showDone(meta, r) {
  var zone;
  if (r.zone === "в зоне") zone = '<span style="color:#15803d">на рабочем месте</span>';
  else if (r.zone === "вне зоны") zone = '<span style="color:#b91c1c">вне рабочего места' + (r.distance ? " · " + r.distance + " м" : "") + "</span>";
  else if (r.zone === "без координат") zone = '<span style="color:#92400e">не определено</span>';
  else zone = '<span class="muted">не проверяется</span>';

  var notes = [];
  if (r.duplicate) notes.push("Вы уже отметились только что — повторная отметка не нужна.");
  if (r.warning === "prev_open") notes.push("В прошлый раз вы не отметили <b>выход</b>. Сообщите руководителю.");
  if (r.warning === "no_in") notes.push("Сегодня не найден <b>вход</b>. Если вы забыли отметиться утром, сообщите руководителю.");
  if (r.zone === "вне зоны") notes.push("Отметка сохранена, но вы далеко от рабочего места. Руководитель это увидит.");
  if (r.zone === "без координат") notes.push("Отметка сохранена без местоположения. Руководитель это увидит.");

  screen(meta.title,
    icon(meta.cls) +
    '<div class="big ' + meta.cls + '">' + meta.word + "</div>" +
    '<div class="time">' + esc(r.date + " · " + r.time) + "</div>" +
    (r.duplicate ? '<div class="badge info" style="margin-top:10px">уже отмечено</div>' : "") +
    '<div class="rows">' +
      '<div class="r"><span>Сотрудник</span><span>' + esc(r.name || r.code) + "</span></div>" +
      '<div class="r"><span>Местоположение</span>' + zone + "</div>" +
    "</div>" +
    (notes.length ? '<div class="note warn">' + notes.join("<br><br>") + "</div>"
      : '<div class="note">Отметка записана. Страницу можно закрыть.</div>') +
    '<button data-act="close">Готово</button>');
}

/* ================= запуск ================= */
var P = { code: qs("r").toUpperCase(), key: qs("k").toUpperCase(), type: qs("t"), server: qs("s") };

function boot() {
  /* убираем ключ из адресной строки и истории браузера */
  try { if (location.search) history.replaceState(null, "", location.pathname); } catch (e) {}
  if (P.code && P.key) return doRegister(P.code, P.key, P.server, false);
  if (P.type === "in" || P.type === "out") return doPunch(P.type, P.server, false);
  screen("Служебная страница", icon("warn") +
    '<div class="note">Эта страница открывается сама, когда вы сканируете QR-код на работе камерой телефона.<br><br>' +
    "Чтобы привязать телефон — отсканируйте свой личный код. Чтобы отметиться — код «ВХОД» или «ВЫХОД» у двери.</div>");
}

document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]");
  if (!b) return;
  var act = b.getAttribute("data-act");
  if (act === "close") { window.close(); setTimeout(function () { location.replace("about:blank"); }, 150); }
  if (act === "reload") doRegister(P.code, P.key, P.server, false);
  if (act === "force-reg") doRegister(P.code, P.key, P.server, true);
  if (act === "retry") doPunch(b.getAttribute("data-type"), P.server, false);
  if (act === "nogeo") doPunch(b.getAttribute("data-type"), P.server, true);
});

boot();
</script>
</body>
</html>
