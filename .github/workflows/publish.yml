name: publish
on:
  push:
    paths:
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download app files
        run: |
          curl -fsSL -o index.html "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/c661cdfcfbc4495fa21ca6ec44e0078b/uchet-index.html"
          curl -fsSL -o emp.html "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/94fc0081c6f84a9bb277ad2d618d9edb/uchet-emp.html"
          curl -fsSL -o app-core.js "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/250be2d799374e298c2865431e163d71/uchet-app-core.js"
          curl -fsSL -o app-views.js "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/2099402ebbdb4f4cac958f61b23449a3/uchet-app-views.js"
          curl -fsSL -o apps-script.gs "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/64f6b2534af8464bb07733204b036073/uchet-apps-script.gs"
          ls -la
      - name: Sanity check
        run: |
          for f in index.html emp.html app-core.js app-views.js apps-script.gs; do test -s "$f"; done
          grep -q "emp.html" app-core.js
          grep -q "ttBoard" apps-script.gs
          grep -q "Телефон привязан" emp.html
          if grep -q "pinbig" app-views.js; then echo "остался блок PIN"; exit 1; fi
          echo "checks passed"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish static app [skip ci]"
            git push
          fi
