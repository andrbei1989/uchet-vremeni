name: publish
on:
  push:
    paths:
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download app files
        run: |
          curl -fsSL -o index.html "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/4e4e9ed9095c47fdbaedc15f081ed13c/uchet-index.html"
          curl -fsSL -o styles.css "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/bffc6850b2bd46ffad4ad002eb83ddf5/uchet-styles.css"
          curl -fsSL -o app-core.js "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/e471e803190f46529aec7fda5c5581be/uchet-app-core.js"
          curl -fsSL -o app-views.js "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/b01296c0d0e94264b0a500652e150603/uchet-app-views.js"
          curl -fsSL -o apps-script.gs "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/718f1493f05e43db8649cd8efa576ed0/uchet-apps-script.gs"
          ls -la
      - name: Sanity check
        run: |
          test -s index.html
          test -s styles.css
          test -s app-core.js
          test -s app-views.js
          head -c 40 index.html
          echo
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish static app [skip ci]"
            git push
          fi
