name: publish
on:
  push:
    paths:
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download app files
        run: |
          curl -fsSL -o index.html "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/3b0f69cbec754bb4ada69111d0179561/uchet-index.html"
          curl -fsSL -o app-core.js "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/2927daab8f004ca4871f0bab6a9824d4/uchet-app-core.js"
          curl -fsSL -o app-views.js "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/99e579bea6964033886981c46e656435/uchet-app-views.js"
          curl -fsSL -o apps-script.gs "https://cdn.omniultra.imagine.art/ceaed39a-684f-4da0-a1e9-ca9f91ee1c26/media/file/ea2a1970fa914dd1b131c26cde75ccf3/uchet-apps-script.gs"
          ls -la
      - name: Sanity check
        run: |
          test -s index.html
          test -s app-core.js
          test -s app-views.js
          test -s apps-script.gs
          grep -q "Авторизуем устройство" app-core.js
          grep -q "Ключ устройства" apps-script.gs
          if grep -q "pinbig" app-views.js; then echo "в app-views остался блок PIN"; exit 1; fi
          if grep -q "Код устарел" app-core.js; then echo "осталась проверка устаревшего кода"; exit 1; fi
          echo "checks passed"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish static app [skip ci]"
            git push
          fi
